          Retail_Delhi,DC_Ghee_Domestic,Ghee_Domestic,leaf_out,outbound,1,1,DEL,0,0,デリー小売
          Retail_Bangalore,DC_Ghee_Domestic,Ghee_Domestic,leaf_out,outbound,2,1,BLR,0,0,バンガロール小売（遠隔）
