          Retail_Dubai,DC_Ghee_Export,Ghee_Export,leaf_out,outbound,1,1,DXB,0,0,ドバイ小売
          Retail_AbuDhabi,DC_Ghee_Export,Ghee_Export,leaf_out,outbound,1,1,AUH,0,0,アブダビ小売
          Retail_Sharjah,DC_Ghee_Export,Ghee_Export,leaf_out,outbound,1,1,SHJ,0,0,シャルジャ小売
