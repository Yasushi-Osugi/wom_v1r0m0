# tools/sweep_specs/india_ghee_a1.yaml
#
# CLAUDE.md 記録の既知バグ A1（multi-leaf_in x 需要段差の擬似CO）を
# data/sample/india-ghee-2026 で再現するスイープ。
#
# 背景：india-ghee-2026 の構築中に発見された既知バグ。MOM に leaf_in が2つ以上ある
# 構成で、その MOM の週次 demand.S に段差が生じると、実在しない CO が固定量で発生し、
# 以降ずっと解消しない（記録では Ghee_Plant_Anand で CO=20,386 固定）。現在のリポジトリの
# india-ghee は回避策適用済みで、Ghee_Domestic 側は Gujarat_Milk_Collective という
# 単一 leaf_in に統合されている。
#
# 原因仮説（未確定、本スイープで検証）：forward_planner.py の _propagate_to_parent が
# 各 leaf_in 子ノードから独立に親 MOM の psi4supply[w][P] へ extend() するため P が
# 重複加算される、という仮説。ただし 2026-08-30 の Mode4 修正調査で push_pull.py の
# Mode4 は extend ではなく =（代入）であることが判明しており、_propagate_to_parent が
# 実際に extend なのかは未確認。本スイープの P_sum 比較（2 leaf_in 合計 vs MOM）で
# 判定する。
#
# ops：Ghee_Domestic 側の Gujarat_Milk_Collective（単一leaf_in）を Anand_Milk_Route /
# Kheda_Milk_Route（2 leaf_in、CLAUDE.md の A1 記録にある名前）へ分割する。影響ファイルは
# sc_tree_master.csv / node_master.csv / node_cost_master.csv / ppc_supplier_cost.csv /
# capacity_plan.csv の5本（capacity_plan.csv は116週分、Gujarat_Milk_Collective の行を
# 週ごとに Anand_Milk_Route / Kheda_Milk_Route の2行へ複製 -- 元と同じ max_supply を
# 両方に与える。Ghee_Export 側の Anand_Export_Route / Mehsana_Milk_Route と同じ
# 「各ルート単独で全量を賄える容量」というパターンに揃えている）。
# lane_assignment.csv / route_master.csv / inventory_master.csv / edge_cost_master.csv には
# Gujarat_Milk_Collective の行が無く、対応不要（事前確認済み）。
#
# holiday_calendar.csv には Retail_Mumbai/Delhi/Bangalore への demand_multiplier=1.4
# （ディワリ、2026-W45/46, 2027-W43/44）のみが定義されており、Ghee_Plant_Anand 自身の
# capacity には一切触れない。remove_file すれば「段差なし（smooth）」、有効のままなら
# 「段差あり（spike）」になる。
#
# target_sku は Ghee_Domestic（ops が対象とする product）。Ghee_Export 側の対照グループ
# （Anand_Export_Route / Mehsana_Milk_Route / Ghee_Plant_Export）を見るには、
# 同じ spec を --sku Ghee_Export で再実行する（tools/sweep_flags.py の既存機能。
# target_nodes は product をまたいで名前一致するため、そのまま使い回せる）。
#
# 実行:
#   python -m tools.sweep_flags --spec tools/sweep_specs/india_ghee_a1.yaml
#   python -m tools.sweep_flags --spec tools/sweep_specs/india_ghee_a1.yaml --sku Ghee_Export

model: data/sample/india-ghee-2026
target_sku: Ghee_Domestic
target_nodes:
  - Gujarat_Milk_Collective  # leaf_in（single構成のケースのみ存在）
  - Anand_Milk_Route         # leaf_in（multi構成のケースのみ存在）
  - Kheda_Milk_Route         # leaf_in（multi構成のケースのみ存在）
  - Ghee_Plant_Anand         # mom（A1 の発生ノード）
  - SP_Ghee_Domestic         # supply_point
  - DC_Ghee_Domestic         # dad
  - Anand_Export_Route       # leaf_in（対照群、Ghee_Export。元から2leaf_in・需要は滑らか）
  - Mehsana_Milk_Route       # leaf_in（対照群、Ghee_Export）
  - Ghee_Plant_Export        # mom（対照群、Ghee_Export）
plugins: safe

cases:
  # 単一leaf_in（現状のまま）+ ディワリ需要スパイクあり = 現行の委託構成そのもの
  - name: base_single
    ops: []

  # 2 leaf_in に分割 + ディワリ需要スパイクあり = A1 再現の本命ケース
